name = "mesearch"
main = "src/index.ts"
compatibility_date = "2025-01-18"
account_id = "facf6619808dc039df729531bbb26d1d"
workers_dev = true
preview_urls = true

[build]
command = "npm run build:frontend"

[[routes]]
pattern = "mesearch.emilycogsdill.com"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "mesearch-db"
database_id = "placeholder-will-be-created"

[dev]
port = 8787

[observability]
enabled = true
head_sampling_rate = 1

# Secrets (set via wrangler secret put):
# JWT_SECRET
# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET
