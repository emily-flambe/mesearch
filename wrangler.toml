name = "mesearch"
main = "src/index.ts"
compatibility_date = "2025-01-18"
account_id = "facf6619808dc039df729531bbb26d1d"
workers_dev = true
preview_urls = true

[build]
command = "npm run build:frontend"

[[routes]]
pattern = "mesearch.emilycogsdill.com"
custom_domain = true

[[routes]]
pattern = "mesearcher.com"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "mesearch-db"
database_id = "abb3d542-bc9b-4057-8618-c0044d38a2a1"

[[kv_namespaces]]
binding = "FEATURE_FLAGS"
id = "c8d2f6dffec949689846807ee3483779"
preview_id = "30125aa0277d444cbc41419bde470ebd"

[dev]
port = 8787

[observability]
enabled = true
head_sampling_rate = 1

# Authentication handled by Cloudflare Access - no secrets needed in Worker
